<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student - PrantaShiksha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Edit Student Details</h2>
        <form method="POST">
            <label>Student Name:</label>
            <input type="text" name="name" value="{{ student.name }}" required>
            
            <label>Class:</label>
            <input type="text" name="student_class" value="{{ student.student_class }}" required>
            
            <label>Subject:</label>
            <input type="text" name="subject" value="{{ student.subject }}" required>

            <label>Total Fee (₹):</label>
            <input type="number" step="0.01" name="total_fee" value="{{ student.total_fee }}" required>

            <button type="submit" class="btn" style="margin-top: 15px;">Update Student</button>
        </form>
        <br>
        <a href="{{ url_for('index') }}" class="btn" style="background-color: #7f8c8d;">← Back to Dashboard</a>
    </div>
</body>
</html>
