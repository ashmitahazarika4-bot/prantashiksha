<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - PrantaShiksha</title>
    
    <!-- Mobile App Manifest & Custom Logo Links -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.jpg') }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #f39c12;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #d68910;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #3498db;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Edit Student Details</h2>
        
        <form method="POST">
            <div class="form-group">
                <label>Student Name:</label>
                <input type="text" name="name" value="{{ student.name }}" required>
            </div>
            <div class="form-group">
                <label>Class:</label>
                <input type="text" name="student_class" value="{{ student.student_class }}" required>
            </div>
            <div class="form-group">
                <label>Subject:</label>
                <input type="text" name="subject" value="{{ student.subject }}" required>
            </div>
            <button type="submit" class="btn">Update Student</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">Back to Home</a>

        <!-- Footer -->
        <div class="footer">
            Developed & Managed By Ashmita Hazarika
        </div>
    </div>

</body>
</html>
