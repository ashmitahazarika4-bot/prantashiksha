<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student - PrantaShiksha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Add New Student</h2>
        <form method="POST">
            <label>Student Name:</label>
            <input type="text" name="name" required>
            
            <label>Class:</label>
            <input type="text" name="student_class" required>
            
            <label>Subject:</label>
            <input type="text" name="subject" required>

            <label>Total Fee (₹):</label>
            <input type="number" step="0.01" name="total_fee" value="0" required>

            <button type="submit" class="btn" style="margin-top: 15px;">Add Student</button>
        </form>
        <br>
        <a href="{{ url_for('index') }}" class="btn" style="background-color: #7f8c8d;">← Back to Dashboard</a>
    </div>
</body>
</html>
